<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Spot My Stayy | Chat Room</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    <div class="logo">
        <img src="logo1.png" alt="Spot My Stayy Logo" class="logo-img">
        
    </div>
    <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
        <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
        <a href="dashboard.html" class="nav-link" id="dashboard-link" style="display: none;"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="admin.html" class="nav-link" id="admin-link" style="display: none;"><i class="fas fa-user-shield"></i> Admin</a>
        <a href="chat.html" class="nav-link"><i class="fas fa-comments"></i> Chats</a>
        <div class="nav-right">
            <button id="list-property-btn" class="btn-primary" style="display: none;"><i class="fas fa-plus-circle"></i> List Property</button>
            <button id="logout-btn" class="btn-outline" style="display: none;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            <span id="user-display" class="user-guest"></span>
            <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</nav>

<main class="section">
    <div id="chat-room-container" style="display: flex; flex-direction: column; height: 70vh;">
        <div id="messages" style="flex: 1; overflow-y: auto; background: var(--card-bg); border-radius: 28px; padding: 1rem;"></div>
        <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <input type="text" id="message-input" placeholder="Type a message..." style="flex: 1; padding: 12px; border-radius: 40px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
            <button id="send-message" class="btn-primary"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>
</main>

<footer class="professional-footer">
    <div class="footer-container">
        <div class="footer-logo">
            <img src="logo1.png" alt="Spot My Stayy" class="footer-logo-img">
            <span>© 2026 Spot My Stayy. All rights reserved.</span>
        </div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="terms.html">Terms</a>
        </div>
    </div>
</footer>

<script type="module" src="js/core.js"></script>
<script type="module" src="js/main.js"></script>

<script>
    (function() {
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (!hamburger || !navLinks) return;
        function closeMenu() { navLinks.classList.remove('active'); document.body.classList.remove('menu-open'); }
        hamburger.addEventListener('click', function(e) { e.stopPropagation(); navLinks.classList.toggle('active'); document.body.classList.toggle('menu-open'); });
        document.addEventListener('click', function(event) { if (navLinks.classList.contains('active') && !navLinks.contains(event.target) && !hamburger.contains(event.target)) closeMenu(); });
        navLinks.addEventListener('click', function(e) { e.stopPropagation(); });
    })();
</script>
</body>
</html>
