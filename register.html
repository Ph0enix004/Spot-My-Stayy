<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Spot My Stayy | Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <div class="logo">
            <img src="logo1.png" alt="Spot My Stayy Logo" class="logo-img">
            
        </div>
        <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            <div class="nav-right">
                <span id="user-display" class="user-guest"></span>
                <button id="theme-toggle" class="theme-btn"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="section auth-page">
        <div class="auth-card-modern">
            <div class="auth-brand">
                
            </div>
            <div class="auth-header-modern">
                <h1>Create Account</h1>
                <p>Please fill in your details to get started</p>
            </div>
            <div class="auth-toggle"><a href="login.html">Sign In</a><a href="register.html" class="active">Sign Up</a>
            </div>
            <form id="register-form">
                <div class="form-row-modern">
                    <div class="form-group-modern half"><label>First Name</label><input type="text" id="reg-firstname"
                            placeholder="John" required></div>
                    <div class="form-group-modern half"><label>Last Name</label><input type="text" id="reg-lastname"
                            placeholder="Doe" required></div>
                </div>
                <div class="form-group-modern"><label>Email Address</label><input type="email" id="reg-email"
                        placeholder="hello@example.com" required></div>
                <div class="form-group-modern"><label>Password</label><input type="password" id="reg-password"
                        placeholder="Create a strong password" required></div>
                <button type="submit" class="btn-continue">Register <i class="fas fa-user-check"></i></button>
            </form>
            <div class="auth-divider">Or Sign Up With</div>
            <div class="social-login"><button class="social-btn google-btn"><i class="fab fa-google"></i>
                    Google</button><button class="social-btn apple-btn"><i class="fab fa-apple"></i> Apple</button>
            </div>
            <div class="auth-footer-modern">
                <p>Already have an account? <a href="login.html">Login here →</a></p>
            </div>
        </div>
    </main>

    <footer class="professional-footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="logo1.png" alt="Spot My Stayy" class="footer-logo-img">
                <span>© 2026 Spot My Stayy. All rights reserved.</span>
            </div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="terms.html">Terms</a>
            </div>
        </div>
    </footer>

    <script>
        (function () {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            if (!hamburger || !navLinks) return;
            function closeMenu() { navLinks.classList.remove('active'); document.body.classList.remove('menu-open'); }
            hamburger.addEventListener('click', function (e) { e.stopPropagation(); navLinks.classList.toggle('active'); document.body.classList.toggle('menu-open'); });
            document.addEventListener('click', function (event) { if (navLinks.classList.contains('active') && !navLinks.contains(event.target) && !hamburger.contains(event.target)) closeMenu(); });
            navLinks.addEventListener('click', function (e) { e.stopPropagation(); });
        })();
    </script>

    <script type="module" src="js/core.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
